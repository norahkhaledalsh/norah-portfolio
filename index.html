  const liB = `<a class="btn" href="${SITE.linkedin}" target="_blank" rel="noopener">${ic("li", 16)}${u.li}${ar()}</a>`;
  const btns = `<div class="btns">${mailB}${liB}</div>`, hbtns = `<div class="btns">${mailB}${cvB}${liB}</div>`;
  return `<section class="hero" id="top"><div class="w hw"><div class="hrow"><span>N / A</span><span>${c.eyebrow}</span></div>
    <div><h1>${c.name}</h1><p class="role">${c.role}</p><p class="tag">${c.tagline}</p><p class="mute hd">${c.hero}</p>${c.istqb ? `<div style="margin-top:16px"><span class="badge">${c.istqb}</span></div>` : ""}${hbtns}</div>
    <div class="hrow hb"><span>${ic("pin", 15)} ${c.loc}</span><a href="#about">${u.more}${ar("dn")}</a><span>SOFTWARE · QUALITY · PRECISION</span></div></div></section>`
  + w("about", "flat", `${eb(c.about.k)}<div class="two eq"><h2 class="big">${c.about.h}</h2><div class="prose">${c.about.p.map(x => `<p>${x}</p>`).join("")}</div></div>
    <div class="stats">${stats.map(s => `<div><b>${String(s[0]).padStart(2, "0")}<i>.</i></b><span>${s[1]}</span></div>`).join("")}</div>`)
  + w("projects", "alt", head(c.projects.k, c.projects.h) + c.projects.items.map(p => projectCard(p, u)).join(""))
  + w("skills", "alt", head(sk.k, sk.h, sk.sub) + `<div class="grid g2">${groups.map((g, i) => `<div class="card sc"><span class="ico">${ic(ICONS[i])}</span><h3>${g[0]}</h3><p class="mute">${sk.desc[i]}</p><div class="sl">${g[1].map(x => `<span>${x}</span>`).join("")}</div></div>`).join("")}</div>
    <div class="beyond"><b>${sk.beyond}</b><ul>${soft[1].map(x => `<li>${ic("check", 14)}${x}</li>`).join("")}</ul></div>`)
  + w("experience", "flat", `<div class="two"><div>${eb(c.experience.k)}<h2 class="big">${c.experience.h}</h2></div><div class="tl2">${c.experience.items.map(i => { const o = org(i.s); return `<div class="ti"><div class="date">${i.d}</div><h3 class="xl">${i.t}</h3>${o.type ? `<div class="mute sm">${o.type}</div>` : ""}<b class="org" style="margin-top:14px">${o.name}</b><div class="mute sm">${o.dept}</div><p class="mute">${i.p}</p>${certBtn(i, u)}</div>`; }).join("")}</div></div>`)
  + w("education", "alt", head(ed.k, ed.h) + `<div class="grid g2">${ed.items.map((i, n) => `<div class="card sc ec"><div class="erow"><span class="ico">${ic(n ? "cap" : "book")}</span><span class="date">${i.d}</span></div><h3 class="xl">${i.t}</h3><b class="org">${i.s}</b><div style="margin-top:16px"><span class="chip">${i.g}</span></div>${certBtn(i, u)}</div>`).join("")}</div>
    `)
  + w("certs", "flat", `${eb(u.certs)}<h2 class="big" style="margin-bottom:32px">${ed.ch}</h2><div class="grid g4">${ed.certs.map(g => `<div><h3 class="cert">${ic("award", 18)}${g[0]}</h3><ul class="list mute">${g[1].map(x => x.cert ? `<li><button type="button" class="cl" data-cert="${x.cert}" data-verify="${x.verify || ""}" data-title="${x.n}">${x.n}</button></li>` : `<li>${x.n}</li>`).join("")}</ul></div>`).join("")}</div>`)
  + w("community", "solid", `<div class="two eq"><div>${eb(v.h)}<h2 class="big">${v.hh}</h2></div><div><div class="date">${v.d}</div><h3 class="xl">${v.t}</h3><p class="mute">${v.p}</p><hr class="hr"><p class="award">${ic("award", 24)}<span class="mute">${v.cert}</span></p></div></div>
    <div class="langs"><b>${u.langs}</b>${ed.langs.map(x => `<span class="mute">${x}</span>`).join("")}</div>`)
  + w("contact", "flat", `<div class="cc">${eb(c.contact.k)}<h2 class="huge">${c.contact.h}</h2><p class="mute">${c.contact.p}</p>${btns.replace('class="btns"', 'class="btns" style="margin:28px 0"')}<div class="links2"><a href="mailto:${SITE.email}">${SITE.email}${ar()}</a><a href="${SITE.linkedin}" target="_blank" rel="noopener">in / ${li2}${ar()}</a></div></div>`);
})();
  $("#foot").innerHTML = `<b>${c.name}</b><span>${c.foot}</span><a href="#top">${u.top}${ar("up")}</a>`;
}

const mq = matchMedia("(prefers-color-scheme: dark)");
const isDark = () => { const t = document.documentElement.dataset.theme; return t ? t === "dark" : mq.matches; };
const paint = () => { $("#theme").innerHTML = ic(isDark() ? "sun" : "moon", 18); };
try { const t = localStorage.getItem("theme"); if (t === "dark" || t === "light") document.documentElement.dataset.theme = t; } catch (e) {}
paint();
$("#theme").addEventListener("click", () => {
  const n = isDark() ? "light" : "dark";
  document.documentElement.dataset.theme = n;
  try { localStorage.setItem("theme", n); } catch (e) {}
  paint();
});

addEventListener("scroll", () => { const h = document.documentElement; $("#prog").style.width = (h.scrollTop / ((h.scrollHeight - h.clientHeight) || 1) * 100) + "%"; }, { passive: true });

const lb = $("#lb"); let lbFrom = null;
function closeCert() { lb.hidden = true; $("#lbb").innerHTML = ""; document.body.style.overflow = ""; if (lbFrom) lbFrom.focus(); }
function openCert(b) {
  const u = CONTENT[lang].ui, path = b.dataset.cert, v = b.dataset.verify, ttl = b.dataset.title || "";
  lbFrom = b; $("#lbt").textContent = ttl;
  $("#lbb").innerHTML = /\.pdf($|[?#])/i.test(path) ? `<iframe src="${path}" title="${ttl}"></iframe>` : `<img src="${path}" alt="${ttl}">`;
  const img = $("#lbb img"); if (img) img.onerror = () => { $("#lbb").innerHTML = `<p class="mute">${u.nofile}</p>`; };
  $("#lbf").innerHTML = `<a class="btn" href="${path}" target="_blank" rel="noopener">${u.open}${ar()}</a>` + (v ? `<a class="btn" href="${v}" target="_blank" rel="noopener">${u.verify}${ar()}</a>` : "");
  $("#lbx").setAttribute("aria-label", u.close);
  lb.hidden = false; document.body.style.overflow = "hidden"; $("#lbx").focus();
}
document.addEventListener("click", e => { const b = e.target.closest("[data-cert]"); if (b) openCert(b); });
lb.addEventListener("click", e => { if (e.target === lb) closeCert(); });
$("#lbx").addEventListener("click", closeCert);
document.addEventListener("keydown", e => { if (e.key === "Escape" && !lb.hidden) closeCert(); });

let lang = "ar";
try { const s = localStorage.getItem("lang"); if (s === "en" || s === "ar") lang = s; } catch (e) {}
render(lang);
$("#lang").addEventListener("click", () => {
  lang = lang === "ar" ? "en" : "ar";
  try { localStorage.setItem("lang", lang); } catch (e) {}
  render(lang);
});
</script>
</body>
</html>
